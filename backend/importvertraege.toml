# Architekturverträge nach ADR 0002, 4.3 im Umfang von G1, geprüft von import-linter in D18
# (make architekturvertraege, --config backend/importvertraege.toml).
# Die Quellenlisten der Verträge 2, 3 und 6 zählen die obersten Pakete einzeln auf; das
# ausgenommene Paket fehlt in der Liste (ein ignore_imports ohne Treffer ist ein Fehler).
# tests/architektur/test_vertragsquellen.py gleicht die Listen mit dem Paketbaum ab; der
# Abgleich der Wurzelpakete im Rezept von D18 deckt ein oberstes Paket neben r3cosint ab.
# Vertrag 10 (ADR 0007, Verträge, Zeile 10; Einheit S1.1) zählt alle 14 obersten Pakete ohne
# Ausnahme als Quellen: asyncpg und alembic importiert unter r3cosint kein Modul unmittelbar;
# die Datenbank erreicht der Code über SQLAlchemy, Alembic läuft in backend/migrationen, das
# kein Paket von r3cosint ist (dort gilt der Architekturtest "Revisionen importieren nichts
# aus r3cosint"). Mittelbare Importe über sqlalchemy bleiben erlaubt.
# Die Verträge 4 und 8 (Schreibverträge, ADR 0007, Verträge; Einheit S1.2) zählen die 13 obersten
# Pakete ausser spur beziehungsweise fall als Quellen: nur dieses Paket darf seine Table-Objekte
# und seinen Store importieren (fall.store seit S1.3); Vertrag 9 ordnet die Schichten
# kanon über fall über spur über core. Der Vertrag 5 (Bestand) entsteht mit S1.4.

[tool.importlinter]
root_packages = ["r3cosint"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Vertrag 1 (R3-F-014): vorschlag und ausfuehrung sind voneinander unabhaengig"
type = "independence"
modules = [
    "r3cosint.freigabe.vorschlag",
    "r3cosint.freigabe.ausfuehrung",
]

[[tool.importlinter.contracts]]
name = "Vertrag 2 (R3-F-015): ausgehende Verbindungen nur in ausgang"
type = "forbidden"
source_modules = [
    "r3cosint.core",
    "r3cosint.kanon",
    "r3cosint.spur",
    "r3cosint.fall",
    "r3cosint.zugriff",
    "r3cosint.freigabe",
    "r3cosint.beschaffung",
    "r3cosint.fremd",
    "r3cosint.llm",
    "r3cosint.graph",
    "r3cosint.export",
    "r3cosint.api",
    "r3cosint.mcpsrv",
]
forbidden_modules = [
    "httpx",
    "httpx2",
    "httpcore",
    "httpcore2",
    "requests",
    "urllib3",
    "aiohttp",
    "httplib2",
    "pycurl",
    "websockets",
    "websocket",
    "grpc",
    "socket",
    "smtplib",
    "ftplib",
    "imaplib",
    "poplib",
    "xmlrpc",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Vertrag 3 (R3-F-018), ausserhalb llm: kein Modellendpunkt"
type = "forbidden"
source_modules = [
    "r3cosint.core",
