# Projekt- und Werkzeugkonfiguration von backend/ (ADR 0002, Abschnitt 5, Nachtrag vom
# 2026-10-28, Einheit G1). Schranken der Abhängigkeiten: untere Schranke die beim Bau
# aufgelöste Fassung, obere die nächste Hauptfassung (bei 0.x die nächste Nebenfassung,
# für ruff stets die Nebenfassung); Exaktheit und Prüfsummen trägt uv.lock.
# Karenzfrist (ADR 0002, Abschnitt 5, Nachtrag vom 2026-10-29, Einheit N1): exclude-newer
# unter [tool.uv] lässt bei jeder Auflösung nur Dateien zu, die mindestens sieben mal 24
# Stunden vorher hochgeladen wurden. Pflege: Bei jeder Aktualisierung und jeder neuen
# Abhängigkeit folgt die untere Schranke der Auflösung unter der Frist; die obere ändert
# sich nur mit einer Aktualisierung über sie hinaus, als eigene Änderung. Eine Ausnahme
# für ein einzelnes Paket (exclude-newer-package) gibt es allein nach einem Fund von D8
# und mit Registereintrag; Einzelheiten im Nachtrag.

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[project]
name = "r3cosint"
version = "0.0.0"
description = "R3cOSINT: Verbindungsserver zwischen einem Sprachmodell und bestehenden Ermittlungsquellen (Grundgerüst)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.159.1,<0.163",
    "pydantic>=2.14.1,<3",
    "uvicorn>=0.54.0,<0.55",
    "sqlalchemy[asyncio]>=2.1.6,<3",
    "alembic>=1.20.1,<2",
    "asyncpg>=0.32.0,<0.33",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1,<0.18",
    "mypy>=2.4.0,<3",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "anyio>=4.15.1,<5",
    "import-linter>=2.15,<3",
    "pip-audit>=2.10.1,<3",
    "httpx>=0.28.1,<0.29",
    "pyyaml>=6.0.3,<7",
    "types-pyyaml>=6.0.12.20260906,<7",
]

[tool.uv]
default-groups = ["dev"]
python-preference = "only-system"
python-downloads = "never"
required-version = ">=0.11.32,<0.12"
# Karenzfrist von sieben mal 24 Stunden (Festlegung ADR 0002, Abschnitt 5, Nachtrag vom
# 2026-10-29): Die untere Schranke folgt der Auflösung unter dieser Frist, die obere
# bleibt, bis eine Aktualisierung über sie hinausgeht.
exclude-newer = "P7D"

[tool.ruff]
target-version = "py313"
src = ["src"]
fix = false

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "B", "S", "ASYNC", "DTZ", "T20", "BLE", "TID", "PGH", "RUF", "I", "UP", "INP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "INP001"]
"src/r3cosint/ausgang/**" = ["TID251"]
# Benannte Ausnahme je Datei (ADR 0007, Abschnitt "Teststufen"): die Sitzungsfixture ruft docker
# als Liste ohne Shell auf (S603), mit dem Programmnamen aus dem PATH (S607); der Digest des
# Images ist gegen das Muster sha256 plus 64 Hexzeichen geprüft, kein Aufruf trägt fremden Text.
"tests/conftest.py" = ["S603", "S607"]
# Benannte Ausnahme (ADR 0007, Festlegung S1.2): die Tests der Spuren bauen ihre SQL-Texte aus festen
# Tabellennamen (Werte der Enum Spur) und aus Kennungen, Prüfsummen und Zahlen, die der Test selbst
# erzeugt; kein Text stammt von aussen (S608).
"tests/integration/test_spur_*.py" = ["S608"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"urllib.request".msg = "Ausgehende Verbindungen nur in r3cosint.ausgang (Vertrag 2, ADR 0002, 4.3)."
"http.client".msg = "Ausgehende Verbindungen nur in r3cosint.ausgang (Vertrag 2, ADR 0002, 4.3)."

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --import-mode=importlib"
xfail_strict = true
markers = ["abnahme: Abnahmetest eines Backlog-Eintrags (ADR 0002, 3.12)"]

[tool.coverage.run]
branch = false
