# Erzeugt bei einem Meilenstein automatisch Versionsschild und Release
# (Projektauftrag 6.6).
#
# Was ein Meilenstein ist, entscheidet der Auftraggeber — durch das Label
# "meilenstein" am Pull Request. Der Arbeitsablauf feuert erst nach dem
# Merge; ein gelabelter, aber nicht gemergter Pull Request erzeugt nichts.
#
# Claude Code taggt selbst nie: Ein Versionsschild ist ein
# Meilensteinentscheid des Auftraggebers und zeigt auf einen Stand von
# main; Schreibhandlungen auf main sind für Claude Code gesperrt (3.2 c).
# Die Automatik läuft ausserhalb der Sandbox, mit eigenen Rechten, und ist
# im Verlauf des Repositories nachvollziehbar (6.6). Einzelheiten:
# .claude/rules/versionierung-und-nachweisfluss.md.
#
# Versionsableitung nach Semantic Versioning aus den Conventional-Commit-
# Betreffzeilen seit dem letzten Versionsschild:
#   - BREAKING CHANGE im Betreff oder "!" nach dem Typ  -> major
#   - feat                                              -> minor
#   - fix, docs, chore und alles Übrige                 -> patch
# Existiert noch kein Versionsschild, beginnt die Zählung bei v0.1.0.
#
# Bewusste Folge des GITHUB_TOKEN: Ein von diesem Arbeitsablauf erzeugtes
# Versionsschild löst keine weiteren Arbeitsabläufe aus (GitHub verhindert
# Kettenauslösung durch das eigene Token). Heute kein Verlust, weil der
# paths-Filter des Push-Auslösers dort alle Pfade der Artefaktliste des
# Nachweis-Erzeugers abdeckt und der Push des Merges den Nachweisfluss
# deshalb bereits ausgelöst hat — wächst die Artefaktliste, muss der
# paths-Filter mitwachsen (.claude/rules/versionierung-und-nachweisfluss.md).

name: Meilenstein-Tag und Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

# Schreibrecht nur auf Inhalte des eigenen Repositories: Versionsschild
# und Release. Kein Zugriff auf Repo B, keine weiteren Rechte.
permissions:
  contents: write

# Serialisiert die Läufe, damit zwei schnell aufeinanderfolgende
# Meilenstein-Merges sich nicht überholen und keine Version doppelt
# vergeben wird.
concurrency:
  group: meilenstein-tag
  cancel-in-progress: false

jobs:
  taggen:
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'meilenstein')
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0 # vollständige Historie samt Versionsschildern für die Ableitung

      - name: Version ableiten
        id: version
        run: |
          set -euo pipefail
          # for-each-ref statt "git tag | head": eine frühzeitig
          # geschlossene Pipe würde unter pipefail den Schritt abbrechen.
          letztes=$(git for-each-ref --sort=-v:refname --count=1 \
            --format='%(refname:short)' 'refs/tags/v*')

          # Der Name des letzten Versionsschilds wird unten arithmetisch
          # weiterverarbeitet und bestimmt den Wert, der als "wert" nach
          # GITHUB_OUTPUT geht. Nur die erwartete Form wird akzeptiert; alles
          # andere bricht den Lauf ab, statt eine unsinnige Version zu
          # erzeugen oder unter set -e an der Arithmetik zu scheitern.
          #
          # Geprueft und ausdruecklich NICHT der Grund: eine Befehlsausfuehrung
          # ueber $(( )). Bash fuehrt zwar einen Feldindex "x[$(...)]" bei der
          # arithmetischen Auswertung mit aus, aber "[" ist in einem Git-
          # Referenznamen unzulaessig (git check-ref-format weist ihn ab), und
          # die schlichte Form "$(...)" wird in $(( )) nicht ersetzt, sondern
          # als Syntaxfehler gemeldet. Beides am 2026-08-25 mit bash 5.2
          # geprueft. Die Pruefung bleibt trotzdem stehen: sie haelt den Wert
          # nachweisbar wohlgeformt, bevor er weitergereicht wird.
          if [ -n "$letztes" ] \
              && ! printf '%s' "$letztes" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Letztes Versionsschild hat eine unerwartete Form." >&2
            echo "Erwartet wird vMAJOR.MINOR.PATCH mit reinen Ziffern." >&2
            echo "Das Versionsschild von Hand pruefen und den Lauf wiederholen." >&2
            exit 1
          fi

          if [ -n "$letztes" ]; then
            bereich="${letztes}..HEAD"
            IFS='.' read -r major minor patch <<<"${letztes#v}"
          else
            bereich="HEAD"
            major=0; minor=0; patch=0
          fi

          # Die Betreffzeilen gehen in eine Datei im Lauf-Arbeitsverzeichnis,
          # nicht durch GITHUB_OUTPUT. Ein mehrzeiliger Ausgabewert braucht
          # dort einen Trenner; ein Betreff, der den Trenner nachahmt, wuerde
          # den Block vorzeitig beenden und die Folgezeilen als weitere
          # Ausgaben setzen. Betreffzeilen bestimmt jeder, dessen Pull Request
          # gemergt wird — auch aus einem Fork (CONTRIBUTING.md). Die Datei
          # kennt dieses Problem nicht.
          betreffs_datei="$RUNNER_TEMP/betreffs.txt"
          git log --format=%s "$bereich" > "$betreffs_datei"
          if [ ! -s "$betreffs_datei" ]; then
            echo "Keine Commits seit ${letztes:-Beginn}. Kein Versionsschild."
            echo "erzeugen=nein" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          stufe=patch
          if grep -Eq '^[a-z]+(\([^)]*\))?!:|BREAKING CHANGE' "$betreffs_datei"; then
            stufe=major
          elif grep -Eq '^feat(\([^)]*\))?!?:' "$betreffs_datei"; then
            stufe=minor
          fi

          case "$stufe" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch)
              if [ -z "$letztes" ]; then
                # Erste Version überhaupt: v0.1.0 als Startpunkt statt v0.0.1.
                minor=1; patch=0
              else
                patch=$((patch + 1))
              fi
              ;;
          esac

          version="v${major}.${minor}.${patch}"
          echo "Abgeleitet: ${version} (Stufe ${stufe}, seit ${letztes:-Beginn})"
          echo "erzeugen=ja" >> "$GITHUB_OUTPUT"
          echo "wert=${version}" >> "$GITHUB_OUTPUT"

      - name: Versionsschild erzeugen und pushen
        if: ${{ steps.version.outputs.erzeugen == 'ja' }}
        # Jeder Wert kommt ueber env herein und wird als "$VARIABLE" benutzt.
        # Eine Einsetzung von ${{ ... }} unmittelbar in den run-Block waere
        # eine Textersetzung vor der Ausfuehrung: Der Wert wuerde zu Code.
        env:
          VERSION: ${{ steps.version.outputs.wert }}
          PR_NUMMER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          git config user.name "r3cosint-meilenstein[bot]"
          # Die Adresse gehoert dem Konto github-actions[bot]. Die naheliegende
          # Form noreply@users.noreply.github.com waere falsch: GitHub laese
          # daraus den Benutzernamen "noreply" und verlinkte das Versionsschild
          # auf das Profil einer unbeteiligten dritten Person
          # (.claude/rules/versionierung-und-nachweisfluss.md).
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Das Versionsschild zeigt auf den Merge-Commit des
          # Meilenstein-Pull-Requests, nicht auf einen späteren Stand.
          git tag -a "$VERSION" \
            -m "Meilenstein: Pull Request #${PR_NUMMER}" \
            "$MERGE_SHA"
          git push origin "$VERSION"

      - name: Release erzeugen
        if: ${{ steps.version.outputs.erzeugen == 'ja' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.wert }}
        run: |
          set -euo pipefail
          # Beschreibung: die Commit-Betreffzeilen seit dem letzten
          # Versionsschild, eine je Zeile. Sie kommen aus der Datei, die der
          # Ableitungsschritt geschrieben hat — RUNNER_TEMP bleibt ueber die
          # Schritte desselben Auftrags bestehen.
          sed 's/^/- /' "$RUNNER_TEMP/betreffs.txt" \
            > "$RUNNER_TEMP/release-notizen.md"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notizen.md" \
            --verify-tag
