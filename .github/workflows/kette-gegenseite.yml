# Lauf der Kette auf der Gegenseite (O-12): ruft "make dod" auf einem von
# GitHub gestellten Runner auf, ohne die Liste der terminierten Lagen und
# ohne das DoD-Gate. Grundlage: docs/12_Freigabe_Grundgeruest.md, Abschnitt 4,
# Block G4; ADR 0003, Teil B, 6.12.5 ("Der Lauf auf der Gegenseite aus O-12
# ruft dieselbe Kette ohne diese Liste auf; dort ist rot rot").
#
# Bis R3-C-004 endet der Lauf rot, gewollt: der Kettenschritt D9 (Kein
# Rueckkanal) meldet Lage C (FEHLT=scripts/rueckkanal-pruefen.sh), und "make
# dod" endet dann mit Rueckgabewert 2. Der Rueckgabewert ist das Urteil; er
# wird nicht umgedeutet.
#
# Rechte: allein contents: read auf oberster Ebene. Keine Geheimnisse, kein
# Schreibzugriff, kein Commit, kein Versionsschild, kein Kommentar, kein
# Artefakt. Einzige Aktion: actions/checkout ueber die Pruefsumme wie in
# meilenstein-tag.yml. Jeder Wert aus ${{ ... }} geht ueber env in den
# Skriptblock.
#
# Dies ist die Fassung der Messung G4.1 (Zweig wegwerf/g4-messung, nie
# gemergt): erste Fassung des Arbeitsablaufs, ergaenzt um Messschritte. Jeder
# Messschritt traegt das Praefix "MESSUNG G4.1" im Namen und entfaellt in G4.2.

name: "Kette auf der Gegenseite (O-12)"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
  push:
    branches:
      - "wegwerf/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kette:
    name: "make dod (ohne Liste der terminierten Lagen)"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # nur fuer die Messung G4.1, entfaellt in G4.2
      - name: "MESSUNG G4.1 (1) Runner"
        run: |
          set -uo pipefail
          echo "ImageOS=${ImageOS:-fehlt} ImageVersion=${ImageVersion:-fehlt}"
          echo "RUNNER_OS=${RUNNER_OS:-fehlt} RUNNER_ARCH=${RUNNER_ARCH:-fehlt}"
          uname -a || true
          id || true
          echo "nproc=$(nproc || true)"
          free -m || true
          df -h / || true
          df -h "$RUNNER_TEMP" || true
          sudo -n true; echo "sudo -n true: Rueckgabewert $?"
          echo "HOME=$HOME"
          echo "PATH=$PATH"
          echo "RUNNER_TOOL_CACHE=$RUNNER_TOOL_CACHE"
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"

      # nur fuer die Messung G4.1, entfaellt in G4.2
      - name: "MESSUNG G4.1 (2) Fassungen"
        run: |
          set -uo pipefail
          for t in bash make git jq grep sed timeout mktemp sha256sum curl tar docker; do
            p="$(command -v "$t" 2>/dev/null)" || p=""
            if [ -z "$p" ]; then echo "$t: FEHLT"; continue; fi
            v="$("$t" --version 2>&1 | head -n 1)" || true
            echo "$t: $p | $v"
          done
          docker info --format 'ServerVersion={{.ServerVersion}} StorageDriver={{.Driver}} CgroupVersion={{.CgroupVersion}}' 2>&1 || echo "docker info: Rueckgabewert $?"
          docker compose version 2>&1 || echo "docker compose version: FEHLT oder Fehler"
          docker buildx version 2>&1 || echo "docker buildx version: FEHLT oder Fehler"

      # nur fuer die Messung G4.1, entfaellt in G4.2
      - name: "MESSUNG G4.1 (3) Python"
        run: |
          set -uo pipefail
          command -v python3 || echo "python3: FEHLT"
          python3 --version 2>&1 || true
          echo "--- $RUNNER_TOOL_CACHE/Python"
          ls -1 "$RUNNER_TOOL_CACHE/Python" 2>&1 || echo "Verzeichnis fehlt"
          n=0
          for d in "$RUNNER_TOOL_CACHE"/Python/3.13.*; do
            [ -d "$d" ] || continue
            n=$((n + 1))
            echo "Verzeichnis $d"
            ls -1 "$d" 2>&1 || true
            if [ -x "$d/x64/bin/python3.13" ]; then
              echo "  $d/x64/bin/python3.13: $("$d/x64/bin/python3.13" --version 2>&1)"
            else
              echo "  $d/x64/bin/python3.13: FEHLT"
            fi
          done
          echo "Zahl der Verzeichnisse 3.13.*: $n"
          if [ "$n" -eq 1 ]; then echo "genau eine Fassung 3.13.x: ja"; else echo "genau eine Fassung 3.13.x: nein"; fi

      # nur fuer die Messung G4.1, entfaellt in G4.2
      - name: "MESSUNG G4.1 (4) Vorinstalliert"
        run: |
          set -uo pipefail
          command -v uv || echo "uv: fehlt"
          uv --version 2>&1 || echo "uv --version: fehlt"
          command -v gitleaks || echo "gitleaks: fehlt"
          gitleaks version 2>&1 || echo "gitleaks version: fehlt"

      # nur fuer die Messung G4.1, entfaellt in G4.2
      - name: "MESSUNG G4.1 (5) Docker Hub und ghcr.io"
        run: |
          set -uo pipefail
          py="sha256:ae14d4ce8771606477a81446e7ef429edd6762305fc50c84507c1041fa8285d1"
          TOKEN="$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/python:pull" | jq -r '.token // empty')" || TOKEN=""
          if [ -z "$TOKEN" ]; then echo "anonymes Token: nicht erhalten"; fi
          echo "--- HEAD Manifest library/python@$py (vor make dod)"
          curl -sI -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://registry-1.docker.io/v2/library/python/manifests/$py" > "$RUNNER_TEMP/hub-vorher.txt" || echo "curl: Rueckgabewert $?"
          head -n 1 "$RUNNER_TEMP/hub-vorher.txt" || true
          grep -i -E '^(ratelimit-limit|ratelimit-remaining|docker-ratelimit-source):' "$RUNNER_TEMP/hub-vorher.txt" || echo "keine Kopfzeilen zur Ratenbegrenzung"
          echo "--- docker pull ghcr.io/astral-sh/uv"
          t0="$(date +%s)"
          docker pull ghcr.io/astral-sh/uv@sha256:df4cae8f3a96d175e2e5f992e597550000edbe78fdc2594d5cd8de1a217f504c
          rc=$?
          t1="$(date +%s)"
          echo "docker pull ghcr.io: Rueckgabewert $rc, $((t1 - t0)) s"

      # nur fuer die Messung G4.1, entfaellt in G4.2
      - name: "MESSUNG G4.1 (6) PyPI und Dienst von pip-audit"
        run: |
          set -uo pipefail
          echo "--- https://pypi.org/simple/"
          curl -sI https://pypi.org/simple/ | head -n 1 || true
          fa="$(grep -A1 '^name = "fastapi"$' backend/uv.lock | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1)" || fa=""
          echo "fastapi gesperrt in backend/uv.lock: ${fa:-nicht gefunden}"
          if [ -n "$fa" ]; then
            echo "--- https://pypi.org/pypi/fastapi/$fa/json"
            curl -sI "https://pypi.org/pypi/fastapi/$fa/json" | head -n 1 || true
          fi

      - name: Python 3.13 aus dem Werkzeugzwischenspeicher bereitstellen
        run: |
          set -euo pipefail
          verz=()
          for d in "$RUNNER_TOOL_CACHE"/Python/3.13.*/x64; do
            [ -d "$d" ] && verz+=("$d")
          done
          if [ "${#verz[@]}" -ne 1 ]; then
            echo "Python 3.13: erwartet genau ein Verzeichnis 3.13.*/x64, gefunden ${#verz[@]}" >&2
            exit 1
          fi
          echo "Python 3.13 aus ${verz[0]}"
          echo "${verz[0]}/bin" >> "$GITHUB_PATH"

      - name: Python 3.13 pruefen
        run: |
          set -euo pipefail
          python3.13 --version
          p="$(command -v python3.13)"
          echo "python3.13: $p"
          case "$p" in "$RUNNER_TOOL_CACHE"/*) ;; *) echo "python3.13 liegt nicht im Werkzeugzwischenspeicher" >&2; exit 1 ;; esac
          python3 --version

      - name: uv 0.11.32 aus dem Image bereitstellen
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uv-bin"
          c="$(docker create ghcr.io/astral-sh/uv@sha256:df4cae8f3a96d175e2e5f992e597550000edbe78fdc2594d5cd8de1a217f504c)"
          docker cp "$c:/uv" "$RUNNER_TEMP/uv-bin/uv"
          docker rm "$c" >/dev/null
          chmod 0755 "$RUNNER_TEMP/uv-bin/uv"
          echo "$RUNNER_TEMP/uv-bin" >> "$GITHUB_PATH"

      - name: uv 0.11.32 pruefen
        run: |
          set -euo pipefail
          p="$(command -v uv)"
          echo "uv: $p"
          [ "$p" = "$RUNNER_TEMP/uv-bin/uv" ] || { echo "uv liegt nicht unter $RUNNER_TEMP/uv-bin" >&2; exit 1; }
          v="$(uv --version)"
          echo "$v"
          case "$v" in "uv 0.11.32"*) ;; *) echo "erwartet uv 0.11.32" >&2; exit 1 ;; esac

      # nur fuer die Messung G4.1, entfaellt in G4.2
      - name: "MESSUNG G4.1 (3b) Fassungen, die uv sieht"
        run: |
          set -uo pipefail
          uv python list --only-installed 2>&1 || true

      - name: gitleaks 8.21.2 ueber den Hook bereitstellen
        run: |
          set -uo pipefail
          CLAUDE_PROJECT_DIR="$GITHUB_WORKSPACE" bash "$GITHUB_WORKSPACE/.claude/hooks/session-start-gitleaks.sh"
          echo "Hook: Rueckgabewert $?"
          for k in /usr/local/bin/gitleaks "$HOME/.local/bin/gitleaks"; do
            if [ -e "$k" ] || [ -L "$k" ]; then echo "Kandidat vorhanden: $k"; else echo "Kandidat fehlt: $k"; fi
          done
          # Liegt das Binary unter $HOME/.local/bin ausserhalb des PATH, wird das Verzeichnis fuer die naechsten Schritte aufgenommen.
          if ! command -v gitleaks >/dev/null 2>&1 && [ -x "$HOME/.local/bin/gitleaks" ]; then
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            echo "Verzeichnis $HOME/.local/bin nach GITHUB_PATH aufgenommen"
          fi
          exit 0

      - name: gitleaks 8.21.2 pruefen
        run: |
          set -euo pipefail
          soll="50b742abd7daad8bbddb6301f3017efb680632d9a5b3b4d8f137b3aac250e359"
          p="$(command -v gitleaks)" || { echo "gitleaks fehlt (Lage C)" >&2; exit 1; }
          echo "gitleaks: $p"
          v="$(gitleaks version)"
          echo "Fassung: $v"
          real="$(readlink -f "$p")"
          ist="$(sha256sum "$real" | cut -d' ' -f1)"
          echo "SHA-256 von $real: $ist"
          case "$v" in *8.21.2*) ;; *) echo "Fassung ist nicht 8.21.2 (vorinstalliert oder anders bereitgestellt): rot mit Meldung" >&2; exit 1 ;; esac
          [ "$ist" = "$soll" ] || { echo "Summe weicht von der Konstante aus N3.2 ab: rot mit Meldung" >&2; exit 1; }

      # nur fuer die Messung G4.1, entfaellt in G4.2
      - name: "MESSUNG G4.1 Archivstand"
        run: |
          set -uo pipefail
          git cat-file -e 78bcef984583e665edb28f0f2e7ef8f1da0a87dc^{commit}
          echo "Archivstand 78bcef98...: Rueckgabewert $?"
          git branch -r --list 'origin/archiv/*' || true
          echo "flach: $(git rev-parse --is-shallow-repository)"
          echo "Commits: $(git rev-list --count HEAD)"
          echo "Versionsschilder: $(git tag -l 'v*' | wc -l)"

      # nur fuer die Messung G4.1, entfaellt in G4.2
      - name: "MESSUNG G4.1 (8) und O-10 (b) Stapelkonfiguration"
        run: |
          set -uo pipefail
          echo "--- R3COSINT_TEST_GEHEIMNISSE auf nicht bestehendes Verzeichnis"
          R3COSINT_TEST_GEHEIMNISSE="$RUNNER_TEMP/gibt-es-nicht" docker compose -f deploy/compose.test.yml config --quiet 2>&1
          echo "config (Variable auf fehlendes Verzeichnis): Rueckgabewert $?"
          echo "--- ohne Variable, Voreinstellung unter HOME"
          unset R3COSINT_TEST_GEHEIMNISSE
          export R3COSINT_TEST_GEHEIMNISSE="$HOME/.config/r3cosint/test"
          docker compose -f deploy/compose.test.yml config --quiet 2>&1
          rc=$?
          echo "config (Voreinstellung): Rueckgabewert $rc"
          if [ "$rc" -ne 0 ]; then
            echo "O-10 (b) im Lauf: noetig"
            make stapel-test-vorbereiten > "$RUNNER_TEMP/stapel-vorbereiten.log" 2>&1
            echo "make stapel-test-vorbereiten: Rueckgabewert $? (Ausgabe nicht ins Protokoll)"
            docker compose -f deploy/compose.test.yml config --quiet 2>&1
            echo "config nach Vorbereitung: Rueckgabewert $?"
          else
            echo "O-10 (b) im Lauf: nicht noetig"
          fi

      # nur fuer die Messung G4.1, entfaellt in G4.2
      - name: "MESSUNG G4.1 (9) Arbeitsablaufbefehle"
        run: |
          set -euo pipefail
          echo "::LAGE probe-ohne-abschaltung MESSUNG G4.1 (9)::"
          echo "::notice::MESSUNG G4.1 (9) ohne Abschaltung"
          TOKEN="$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          echo "::stop-commands::$TOKEN"
          echo "::LAGE probe-mit-abschaltung MESSUNG G4.1 (9)::"
          echo "::notice::MESSUNG G4.1 (9) mit Abschaltung"
          echo "::$TOKEN::"
          echo "::notice::MESSUNG G4.1 (9) nach Wiedereinschalten"

      # nur fuer die Messung G4.1, entfaellt in G4.2
      - name: "MESSUNG G4.1 (11) Stapelbau ohne bake"
        run: |
          set -uo pipefail
          py="sha256:ae14d4ce8771606477a81446e7ef429edd6762305fc50c84507c1041fa8285d1"
          TOKEN="$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/python:pull" | jq -r '.token // empty')" || TOKEN=""
          echo "--- HEAD Manifest library/python (vor-bau)"
          curl -sI -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://registry-1.docker.io/v2/library/python/manifests/$py" > "$RUNNER_TEMP/hub-vor-bau.txt" || echo "curl: Rueckgabewert $?"
          head -n 1 "$RUNNER_TEMP/hub-vor-bau.txt" || true
          grep -i -E '^(ratelimit-limit|ratelimit-remaining|docker-ratelimit-source):' "$RUNNER_TEMP/hub-vor-bau.txt" || echo "keine Kopfzeilen zur Ratenbegrenzung"
          export R3COSINT_TEST_GEHEIMNISSE="$HOME/.config/r3cosint/test"
          t0="$(date +%s)"
          COMPOSE_BAKE=false docker compose -f deploy/compose.test.yml build 2>&1
          rc=$?
          t1="$(date +%s)"
          echo "docker compose build (COMPOSE_BAKE=false): Rueckgabewert $rc, $((t1 - t0)) s"
          echo "--- HEAD Manifest library/python (nach-bau)"
          curl -sI -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://registry-1.docker.io/v2/library/python/manifests/$py" > "$RUNNER_TEMP/hub-nach-bau.txt" || echo "curl: Rueckgabewert $?"
          head -n 1 "$RUNNER_TEMP/hub-nach-bau.txt" || true
          grep -i -E '^(ratelimit-limit|ratelimit-remaining|docker-ratelimit-source):' "$RUNNER_TEMP/hub-nach-bau.txt" || echo "keine Kopfzeilen zur Ratenbegrenzung"
          docker image ls || true

      - name: make dod
        timeout-minutes: 20
        env:
          # Compose v2.38.2 des Runners uebergibt den Bau an buildx bake; bake
          # verlangt fuer build.network: host das Entitlement network.host, das
          # Compose nicht setzt (Lauf 1: "additional privileges requested").
          # COMPOSE_BAKE=false laesst Compose ueber den BuildKit-Client des
          # Docker-Treibers bauen. deploy/ und der Aufruf bleiben unveraendert.
          COMPOSE_BAKE: "false"
        run: |
          # Ohne -e: die Wiedereinschaltzeile und das Urteil muessen auf jedem Weg folgen.
          set -uo pipefail
          TOKEN="$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          echo "::stop-commands::$TOKEN"
          t0="$(date +%s)"
          make dod 2>&1 | tee "$RUNNER_TEMP/dod.log"
          rc="${PIPESTATUS[0]}"
          echo "::$TOKEN::"
          t1="$(date +%s)"
          echo "make dod: Rueckgabewert $rc, $((t1 - t0)) s"
          exit "$rc"

      # nur fuer die Messung G4.1, entfaellt in G4.2
      - name: "MESSUNG G4.1 (10) nach make dod"
        if: always()
        run: |
          set -uo pipefail
          echo "--- Uebersicht der Kette"
          grep -n -E '::LAGE|^\[D[0-9]+|A_OK|A_FAIL|LAGE C' "$RUNNER_TEMP/dod.log" || true
          echo "--- letzte 60 Zeilen"
          tail -n 60 "$RUNNER_TEMP/dod.log" || true
          echo "--- docker image ls"
          docker image ls || true
          echo "--- HEAD Manifest library/python (nach make dod)"
          py="sha256:ae14d4ce8771606477a81446e7ef429edd6762305fc50c84507c1041fa8285d1"
          TOKEN="$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/python:pull" | jq -r '.token // empty')" || TOKEN=""
          curl -sI -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://registry-1.docker.io/v2/library/python/manifests/$py" > "$RUNNER_TEMP/hub-nachher.txt" || echo "curl: Rueckgabewert $?"
          head -n 1 "$RUNNER_TEMP/hub-nachher.txt" || true
          grep -i -E '^(ratelimit-limit|ratelimit-remaining|docker-ratelimit-source):' "$RUNNER_TEMP/hub-nachher.txt" || echo "keine Kopfzeilen zur Ratenbegrenzung"
          df -h / || true
