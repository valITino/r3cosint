# Überträgt das Nachweisverzeichnis nach Repo B (Projektauftrag 6.6).
#
# Warum als GitHub-Arbeitsablauf und nicht durch Claude Code: Claude Code Web
# kann nicht in ein zweites Repository schreiben, die Sandbox erreicht nur das
# verbundene. Claude Code schreibt deshalb den Arbeitsablauf, ausgeführt wird er
# von GitHub. Das ist keine Notlösung, sondern die saubere Trennung — die
# Automatik läuft ausserhalb der Sandbox, mit eigenen Rechten, und ist im Verlauf
# beider Repositories nachvollziehbar (6.6).
#
# Vorgaben aus 6.6, die hier umgesetzt sind:
#   - Auslöser sind ein Versionsschild, ein Push nach main mit Änderungen an
#     den Pfaden der Artefaktliste sowie der manuelle Start. Rauschen
#     verhindert nicht mehr der seltene Auslöser, sondern die
#     Idempotenzprüfung: bei identischem Stand in Repo B endet der Lauf ohne
#     Schreibvorgang.
#   - Es wird ausschliesslich in das Verzeichnis nachweise/ geschrieben. Alles
#     ausserhalb gehört dem Auftraggeber und wird nie überschrieben.
#   - Übertragen wird das Nachweisverzeichnis, nicht der Inhalt der Artefakte.
#     Repo B bleibt frei von Kopien.
#   - Der Zugang läuft über ein fein begrenztes Zugriffstoken mit Schreibrecht
#     nur auf Repo B. Das Geheimnis liegt in den Repository-Secrets, nie im Code.
#   - Jeder Lauf, der schreibt, erzeugt einen Commit mit dem Bezug im
#     Betreff — dem Versionsschild oder, beim Push-Auslöser, der Prüfsumme
#     des Push-Commits. Ein Lauf ohne Änderung erzeugt keinen Commit.

name: Nachweise nach Repo B übertragen

# Zu den Filtern: branches, tags und paths stehen bewusst im selben
# push-Block. GitHub wertet paths bei Tag-Pushes nicht aus — ein
# Versionsschild löst also immer aus, ein Push nach main nur bei
# Änderungen an den Pfaden der Artefaktliste des Nachweis-Erzeugers.
# Wächst die Artefaktliste, wächst dieser Filter mit
# (.claude/rules/versionierung-und-nachweisfluss.md).
on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "docs/**"
      - ".claude/**"
      - "prototype/**"
      - "CLAUDE.md"
  workflow_dispatch:
    inputs:
      schild:
        description: "Versionsschild, das übertragen werden soll (z. B. v0.3.0)"
        required: true
        type: string
      abzug:
        description: "Zusätzlich einen eingefrorenen Abzug der verwiesenen Dateien erzeugen"
        required: false
        default: false
        type: boolean

# Der Arbeitsablauf liest nur aus Repo A. Geschrieben wird in Repo B, und zwar
# ausschliesslich über das gesondert hinterlegte Token.
permissions:
  contents: read

# Eine Concurrency-Gruppe serialisiert die Läufe: zwei schnell
# aufeinanderfolgende Merges überholen sich nicht; es läuft höchstens ein
# Lauf, ein weiterer wartet (GitHub behält den jeweils neuesten wartenden).
concurrency:
  group: nachweise-uebertragen
  cancel-in-progress: false

env:
  ZIEL_REPO: valITino/r3coscrum
  ZIEL_VERZEICHNIS: nachweise

jobs:
  uebertragen:
    runs-on: ubuntu-latest
    steps:
      - name: Repo A auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # vollständige Historie: die festen Verweise brauchen die Prüfsummen

      - name: Bezug bestimmen
        id: schild
        # Der Bezug benennt, welcher Stand von Repo A übertragen wird:
        # beim manuellen Start das eingegebene Versionsschild, beim Tag-Push
        # das Versionsschild selbst, beim Push nach main — wo es kein
        # Versionsschild gibt — die Prüfsumme des Push-Commits.
        run: |
          if [ -n "${{ inputs.schild }}" ]; then
            echo "wert=${{ inputs.schild }}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "wert=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "wert=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Nachweisverzeichnis neu erzeugen
        run: |
          bash scripts/nachweise-erzeugen.sh docs/NACHWEISE.md

      - name: Erzeugtes Verzeichnis prüfen
        run: |
          # Ein Verweis auf einen Zweig ist kein Nachweis (6.6). Findet sich einer,
          # bricht der Lauf ab, statt einen wertlosen Nachweis zu übertragen.
          # Geprüft werden ausschliesslich echte Verweisziele, nicht der Fliesstext:
          # der erklärende Absatz nennt die unzulässige Form absichtlich.
          ziele=$(grep -oE '\]\(https://github\.com/[^)]+\)' docs/NACHWEISE.md || true)
          if printf '%s' "$ziele" | grep -Eq '/blob/(main|master|HEAD)/'; then
            echo "::error::Zweigverweis in docs/NACHWEISE.md gefunden. Nach 6.6 ist das kein Nachweis."
            printf '%s\n' "$ziele" | grep -E '/blob/(main|master|HEAD)/'
            exit 1
          fi
          # Jedes Verweisziel trägt eine vollständige 40-stellige Prüfsumme.
          if printf '%s' "$ziele" | grep -Eqv '/blob/[0-9a-f]{40}/'; then
            echo "::error::Verweisziel ohne vollständige 40-stellige Commit-Prüfsumme."
            printf '%s\n' "$ziele" | grep -Ev '/blob/[0-9a-f]{40}/'
            exit 1
          fi
          anzahl=$(grep -cE '^\| .+ \| `.+` \|' docs/NACHWEISE.md || true)
          echo "Artefakte im Verzeichnis: $anzahl"
          if [ "$anzahl" -lt 1 ]; then
            echo "::error::Das Nachweisverzeichnis enthält keine Artefakte."
            exit 1
          fi

      - name: Repo B auschecken
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ZIEL_REPO }}
          token: ${{ secrets.NACHWEISE_TOKEN }}
          path: repo-b
          fetch-depth: 0

      - name: Idempotenzprüfung gegen den Stand in Repo B
        id: vergleich
        # Bei identischem Inhalt endet der Lauf ohne Schreibvorgang — das
        # verhindert Rauschen in Repo B, obwohl jeder Merge nach main den
        # Lauf auslösen darf. Ein angeforderter Abzug erzwingt den Lauf,
        # weil er unabhängig vom Verzeichnisinhalt eine Kopie erzeugen soll.
        run: |
          set -euo pipefail
          if [ -f "repo-b/${ZIEL_VERZEICHNIS}/NACHWEISE.md" ] \
             && cmp -s docs/NACHWEISE.md "repo-b/${ZIEL_VERZEICHNIS}/NACHWEISE.md"; then
            if [ "${{ inputs.abzug }}" = "true" ]; then
              echo "Nachweisverzeichnis identisch, aber Abzug angefordert: Lauf wird fortgesetzt."
              echo "schreiben=ja" >> "$GITHUB_OUTPUT"
            else
              echo "Nachweisverzeichnis in Repo B ist inhaltlich identisch. Kein Schreibvorgang."
              echo "schreiben=nein" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Nachweisverzeichnis weicht ab oder fehlt in Repo B. Es wird übertragen."
            echo "schreiben=ja" >> "$GITHUB_OUTPUT"
          fi

      - name: Nachweisverzeichnis nach Repo B schreiben
        if: ${{ steps.vergleich.outputs.schreiben == 'ja' }}
        run: |
          set -euo pipefail
          # Ausschliesslich in nachweise/. Alles ausserhalb gehört dem
          # Auftraggeber und wird nie angefasst (6.6).
          mkdir -p "repo-b/${ZIEL_VERZEICHNIS}"
          cp docs/NACHWEISE.md "repo-b/${ZIEL_VERZEICHNIS}/NACHWEISE.md"
          {
            echo "<!-- Erzeugt aus ${GITHUB_REPOSITORY} durch den Arbeitsablauf"
            echo "     nachweise-uebertragen.yml. Nicht von Hand ändern:"
            echo "     Änderungen gehen beim nächsten Lauf verloren."
            echo "     Bezug (Versionsschild oder Commit): ${{ steps.schild.outputs.wert }}"
            echo "     Quell-Commit:   ${GITHUB_SHA} -->"
          } > "repo-b/${ZIEL_VERZEICHNIS}/HINWEIS.md"

      - name: Eingefrorenen Abzug erzeugen
        if: ${{ inputs.abzug == true && steps.vergleich.outputs.schreiben == 'ja' }}
        run: |
          set -euo pipefail
          # Der einzige zulässige Fall, in dem Inhalte doppelt vorliegen (6.6).
          # Jede Datei trägt Datum und Commit-Prüfsumme im Kopf.
          abzug="repo-b/${ZIEL_VERZEICHNIS}/abzug"
          mkdir -p "$abzug"
          datum=$(date -u +%Y-%m-%d)
          while IFS= read -r pfad; do
            [ -f "$pfad" ] || continue
            ziel="$abzug/$(echo "$pfad" | tr '/' '_')"
            pruefsumme=$(git log -1 --format=%H -- "$pfad")
            {
              echo "<!-- Eingefrorener Abzug aus ${GITHUB_REPOSITORY}"
              echo "     Pfad:        $pfad"
              echo "     Prüfsumme:   $pruefsumme"
              echo "     Abzugsdatum: $datum"
              echo "     Bezug:       ${{ steps.schild.outputs.wert }} -->"
              echo
              cat "$pfad"
            } > "$ziel"
          done < <(grep -oE '`[^`]+\.(md|json|sh)`' docs/NACHWEISE.md | tr -d '`' | sort -u)

      - name: Commit in Repo B erzeugen
        if: ${{ steps.vergleich.outputs.schreiben == 'ja' }}
        working-directory: repo-b
        run: |
          set -euo pipefail
          git config user.name "r3cosint-nachweise[bot]"
          # Die Adresse gehoert dem Konto github-actions[bot]. Die naheliegende
          # Form noreply@users.noreply.github.com waere falsch: GitHub laese
          # daraus den Benutzernamen "noreply" und verlinkte den Commit auf das
          # Profil einer unbeteiligten dritten Person
          # (.claude/rules/versionierung-und-nachweisfluss.md).
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${ZIEL_VERZEICHNIS}"
          if git diff --cached --quiet; then
            echo "Keine Änderung am Nachweisverzeichnis. Kein Commit."
            exit 0
          fi
          # Das Versionsschild steht im Betreff, damit später erkennbar ist,
          # welcher Stand von Repo A welchen Stand von Repo B erzeugt hat (6.6).
          git commit -m "nachweise: Stand ${{ steps.schild.outputs.wert }} aus r3cosint" \
                     -m "Quell-Commit: ${GITHUB_SHA}" \
                     -m "Erzeugt durch nachweise-uebertragen.yml. Nur ${ZIEL_VERZEICHNIS}/ berührt."
          git push
